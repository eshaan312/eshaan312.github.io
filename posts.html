<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eshaan deshmukh posts</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #282828;
        --fg: #ebdbb2;
        --card-bg:#292929;
        --shadow: rgba(0, 0, 0, 0.5);
        --hover-shadow: rgba(0, 0, 0, 0.7);
        --blue: #83a598;
        --green: #b8bb26;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: 'JetBrains Mono', monospace;
        background-color: var(--bg);
        color: var(--fg);
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 2rem;
    }

    h1 {
        margin-bottom: 2rem;
        color: var(--green);
    }
.blog-container {
    display: flex;
    flex-direction: column;
    gap: 2rem;
    width: 100%;
}

.blog-card {
    background-color: var(--card-bg);
    padding: 1.5rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 2px 2px var(--shadow);
    width: 100%;
}
    .blog-card:hover {
        box-shadow: 10px 10px var(--hover-shadow);
        transform: translateY(-3px);
    }

    .blog-card h2 {
        margin-bottom: 1rem;
        color: var(--blue);
        font-size: 1.5rem;
    }

    .blog-card p {
        color: var(--fg);
        line-height: 1.4;
    }

    @media (max-width: 600px) {
        .blog-container {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>
<body>


<div class="blog-container">
  <p>nothing here for now</p>

</body>
</html>
